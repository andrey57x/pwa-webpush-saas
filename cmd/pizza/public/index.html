<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luigi's Pizza Store</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <style>
      .hero {
        text-align: center;
        padding: 40px 0;
        background: var(--pico-card-background-color);
        border-bottom: 1px solid var(--pico-border-color);
        margin-bottom: 30px;
      }
      .status-box {
        margin-top: 15px;
        padding: 12px 16px;
        border-radius: 6px;
        display: none;
      }
      .status-success {
        display: block;
        background-color: rgba(16, 185, 129, 0.15);
        border: 1px solid var(--pico-ins-color);
        color: var(--pico-ins-color);
      }
      .status-error {
        display: block;
        background-color: rgba(239, 68, 68, 0.15);
        border: 1px solid var(--pico-del-color);
        color: var(--pico-del-color);
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <div class="container">
        <h1>Luigi's Pizza Store</h1>
        <p>Автономный интернет-магазин доставки пиццы</p>
      </div>
    </header>

    <main class="container">
      <article>
        <header><strong>Персональные Скидки и Акции</strong></header>
        <p>Подпишитесь на Web Push уведомления через наш PWA Service Worker!</p>
        <button id="sub-btn" onclick="subscribeToPizza()">
          Включить Push-Уведомления
        </button>
        <div id="sub-status" class="status-box"></div>
        <small
          style="
            display: block;
            margin-top: 15px;
            color: var(--pico-muted-color);
          "
        >
          Подключение к SaaS API: <code id="saas-url-display">...</code>
        </small>
      </article>
    </main>

    <script src="/config.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const saasUrl = self.PIZZA_CONFIG
          ? self.PIZZA_CONFIG.saasApiUrl
          : "http://localhost:8080/api/v1";
        document.getElementById("saas-url-display").innerText = saasUrl;
      });

      function urlBase64ToUint8Array(base64String) {
        const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
        const base64 = (base64String + padding)
          .replace(/\-/g, "+")
          .replace(/_/g, "/");
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) {
          outputArray[i] = rawData.charCodeAt(i);
        }
        return outputArray;
      }

      async function subscribeToPizza() {
        const btn = document.getElementById("sub-btn");
        const status = document.getElementById("sub-status");

        const saasApiUrl = self.PIZZA_CONFIG
          ? self.PIZZA_CONFIG.saasApiUrl
          : "http://localhost:8080/api/v1";
        const appCode = self.PIZZA_CONFIG
          ? self.PIZZA_CONFIG.appCode
          : "pizza_app";

        try {
          btn.disabled = true;
          status.className = "status-box";
          status.innerText = "Получение VAPID ключа от SaaS...";

          const appResp = await fetch(`${saasApiUrl}/apps/${appCode}`);
          const appData = await appResp.json();

          if (!appResp.ok || !appData.vapid_public_key) {
            throw new Error(
              appData.error ||
                `Сайт с кодом '${appCode}' не найден в SaaS. Сначала создайте его в панели управления!`,
            );
          }

          const reg = await navigator.serviceWorker.register("/sw.js");
          const sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(
              appData.vapid_public_key,
            ),
          });

          const subJson = sub.toJSON();

          status.innerText = "Сохранение подписки...";
          const res = await fetch(`${saasApiUrl}/subscribe`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              app_code: appCode,
              endpoint: subJson.endpoint,
              p256dh_key: subJson.keys.p256dh,
              auth_key: subJson.keys.auth,
              browser: navigator.userAgent,
              os: navigator.platform,
            }),
          });

          const saved = await res.json();
          if (!res.ok) {
            throw new Error(
              saved.error || "Ошибка сохранения подписки на бэкенде.",
            );
          }

          status.className = "status-box status-success";
          status.innerText = `Подписка успешно оформлена! (ID устройства: ${saved.id})`;
        } catch (err) {
          status.className = "status-box status-error";
          status.innerText = "Ошибка: " + err.message;
          btn.disabled = false;
        }
      }
    </script>
  </body>
</html>
